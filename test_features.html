<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForgeStudio - Advanced Features Test</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <style>
        body { background: #0a0e27; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        h1 { color: #00d4ff; }
        .test-section { margin: 20px 0; padding: 15px; background: #1e1e1e; border-left: 4px solid #00d4ff; border-radius: 8px; }
        .success { color: #00ff88; }
        .error { color: #ff0000; }
        .warning { color: #ffaa00; }
    </style>
    
    <h1>🚀 ForgeStudio - Advanced Features Module Test</h1>
    
    <div class="test-section">
        <h2>Module Status</h2>
        <div id="module-status"></div>
    </div>
    
    <div class="test-section">
        <h2>Available Features</h2>
        <ul id="features-list"></ul>
    </div>
    
    <div class="test-section">
        <h2>Sample Output</h2>
        <div id="sample-output"></div>
    </div>
    
    <script src="data.js" defer></script>
    <script src="i18n.js" defer></script>
    <script src="features.js" defer></script>
    
    <script>
        window.addEventListener('load', () => {
            const statusDiv = document.getElementById('module-status');
            const listDiv = document.getElementById('features-list');
            const sampleDiv = document.getElementById('sample-output');
            
            // Check if features loaded
            if (typeof window.ForgeStudioFeatures === 'undefined') {
                statusDiv.innerHTML = '<p class="error">❌ ForgeStudioFeatures not loaded</p>';
                return;
            }
            
            statusDiv.innerHTML = '<p class="success">✅ ForgeStudioFeatures loaded successfully</p>';
            
            const features = window.ForgeStudioFeatures;
            
            // List all features
            const featureList = Object.keys(features);
            listDiv.innerHTML = featureList.map(f => 
                `<li><strong>${f}:</strong> ${Object.keys(features[f]).join(', ')}</li>`
            ).join('');
            
            // Sample output
            try {
                const perfPred = features.performance.predictPerformance('RTX 5090', '1440p');
                const budgetCat = features.budget.categorizeBudget(1500000);
                const maintenance = features.maintenance.maintenanceTips();
                
                sampleDiv.innerHTML = `
                    <div style="margin: 10px 0;">
                        <strong>Performance Prediction (RTX 5090, 1440p):</strong>
                        <pre>${JSON.stringify(perfPred, null, 2)}</pre>
                    </div>
                    <div style="margin: 10px 0;">
                        <strong>Budget Categorization (1,500,000 Ft):</strong>
                        <pre>${JSON.stringify(budgetCat, null, 2)}</pre>
                    </div>
                    <div style="margin: 10px 0;">
                        <strong class="success">✅ All features are working correctly!</strong>
                    </div>
                `;
            } catch (e) {
                sampleDiv.innerHTML = `<p class="error">❌ Error: ${e.message}</p>`;
            }
        });
    </script>
</body>
</html>
